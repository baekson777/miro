name: blind_weekly_maze
description: Weekly Maze — 2D wall/corridor time-attack maze with weekly challenge & practice modes.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Navigation (stack-safe routing)
  go_router: ^14.8.1

  # State management
  flutter_riverpod: ^2.6.1

  # Rewarded ads for hint recharge (7.x+ required for Gradle 9)
  google_mobile_ads: ^7.0.0

  # OS-level screenshot / screen-record / app-switcher protection
  # Use ≥1.5.1 (1.4.4–1.4.13 had crash reports on some devices)
  screen_protector: ^1.5.1

  # Local persistence (nickname, local leaderboard cache)
  shared_preferences: ^2.5.3

  # Timezone-aware weekly seed (KST Monday 00:00)
  timezone: ^0.10.0

  # Immutable models
  equatable: ^2.0.7

  # UUID for local player id
  uuid: ^4.5.1
  kakao_flutter_sdk_user: ^2.1.0
  firebase_core: ^5.1.0
  cloud_firestore: ^7.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/legal/

  fonts:
    - family: Pretendard
      fonts:
        - asset: assets/fonts/Pretendard-Thin.otf
          weight: 100
        - asset: assets/fonts/Pretendard-ExtraLight.otf
          weight: 200
        - asset: assets/fonts/Pretendard-Light.otf
          weight: 300
        - asset: assets/fonts/Pretendard-Regular.otf
          weight: 400
        - asset: assets/fonts/Pretendard-Medium.otf
          weight: 500
        - asset: assets/fonts/Pretendard-SemiBold.otf
          weight: 600
        - asset: assets/fonts/Pretendard-Bold.otf
          weight: 700
        - asset: assets/fonts/Pretendard-ExtraBold.otf
          weight: 800
        - asset: assets/fonts/Pretendard-Black.otf
          weight: 900
